[workspace]
resolver = "2"
members = [
  "evcxr",
  "evcxr_repl",
  "evcxr_jupyter",
  "evcxr_runtime",
  "runtimes/evcxr_image",
  "print_performance_info",
]

exclude = [
  "evcxr_input",
  "runtimes"
]

[workspace.package]
version = "0.22.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/evcxr/evcxr"
authors = ["The Evcxr Authors"]
edition = "2024"
rust-version = "1.98"

[profile.dev]
# The speedup from optimization significantly exceeds any slowdown in compilation.
opt-level = 2
# Debug is disabled in order to speed up builds.
debug = 0
